name: Deploy main

# On merge to main: push Supabase migrations, then Vercel deploys via Git integration.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  supabase-migrate:
    name: Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Require GitHub secrets
        run: |
          set -euo pipefail
          missing=""
          [ -z "${SUPABASE_ACCESS_TOKEN}" ] && missing="${missing} SUPABASE_ACCESS_TOKEN"
          [ -z "${SUPABASE_DB_PASSWORD}" ] && missing="${missing} SUPABASE_DB_PASSWORD"
          [ -z "${SUPABASE_PROJECT_REF}" ] && missing="${missing} SUPABASE_PROJECT_REF"
          if [ -n "${missing}" ]; then
            echo "::error::Missing required GitHub secrets:${missing}. Add them in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Secrets present for project ref ${SUPABASE_PROJECT_REF}."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Login to Supabase
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations (idempotent)
        run: supabase db push --include-all --yes

  # Vercel project hub-dev deploys automatically when this workflow completes on main.
