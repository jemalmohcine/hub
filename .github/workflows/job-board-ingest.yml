name: Job Board Ingest

on:
  push:
    branches: [main]
    paths:
      - "src/modules/job-board/**"
      - "scripts/job-board-ingest.ts"
      - ".github/workflows/job-board-ingest.yml"
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: job-board-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Scrape job offers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingest
        run: npm run job-board:ingest
