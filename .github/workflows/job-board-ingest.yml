name: Job Board Maintenance

# Triggered on every main merge via post-merge-main.yml (workflow_call).
# Every 3 hours + manual dispatch. Does not scrape jobs for all users.
# Each person collects offers with their own saved search: on demand, or
# silently once per day when they open the app.
on:
  workflow_call:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: job-board-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Purge stale listings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingest
        run: npm run job-board:ingest
